<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="data:," />
  <title>臺南市政府消防局｜3D 火場佈署圖</title>
  <script>
    window.CESIUM_BASE_URL = "https://cdn.jsdelivr.net/npm/cesium@1.122.0/Build/Cesium/";
  </script>
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.122.0/Build/Cesium/Cesium.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.122.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body, #cesiumContainer {
      width: 100%; height: 100%; overflow: hidden;
      background: #0f172a; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: #f8fafc;
    }

    /* 頂部資訊條 */
    .top-hud {
      position: fixed; top: 10px; left: 10px; right: 10px; z-index: 20;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
      background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 10px; padding: 8px 12px;
      font-size: 12px; pointer-events: auto;
    }
    .hud-title { font-weight: 700; color: #f8fafc; display: flex; align-items: center; gap: 6px; }
    .hud-badge { background: #b91c1c; color: #fff; padding: 2px 7px; border-radius: 999px; font-size: 11px; }
    .hud-meta { color: #cbd5e1; font-size: 11px; }

    /* 右側工具面板 */
    .side-panel {
      position: fixed; top: 62px; right: 10px; z-index: 20;
      width: 248px; max-height: calc(100vh - 130px); overflow-y: auto;
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 10px; padding: 10px;
      font-size: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .side-panel.collapsed { display: none; }
    .panel-toggle {
      position: fixed; top: 62px; right: 10px; z-index: 21;
      background: rgba(15, 23, 42, 0.92); color: #fff; border: 1px solid rgba(148,163,184,0.35);
      border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; display: none;
    }
    @media (max-width: 640px) {
      .side-panel { width: 218px; font-size: 11px; }
      .panel-toggle { display: block; }
      .side-panel:not(.collapsed) + .panel-toggle { display: none; }
    }

    .sec-label { font-size: 11px; font-weight: 700; color: #94a3b8; letter-spacing: 0.5px; }
    .btn-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
    .btn-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
    button.tool-btn {
      background: rgba(30, 41, 59, 0.95); color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.3); border-radius: 6px;
      padding: 6px 6px; font-size: 11px; cursor: pointer; transition: 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 3px;
    }
    button.tool-btn:hover { background: rgba(51, 65, 85, 0.95); }
    button.tool-btn.active { background: #dc2626; border-color: #fca5a5; color: #fff; font-weight: 700; }
    button.tool-btn.blue.active { background: #2563eb; border-color: #93c5fd; }

    .info-box {
      background: rgba(30, 41, 59, 0.75); border-radius: 6px; padding: 7px 8px;
      line-height: 1.45; color: #e2e8f0; font-size: 11px;
    }
    .tiles-input-row { display: flex; gap: 4px; }
    .tiles-input-row input {
      flex: 1; min-width: 0; background: #0f172a; color: #f8fafc;
      border: 1px solid rgba(148,163,184,0.35); border-radius: 6px; padding: 5px 6px; font-size: 11px;
    }

    /* 底部視角與截圖列 */
    .bottom-bar {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 20;
      display: flex; align-items: center; gap: 6px; flex-wrap: nowrap;
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 999px; padding: 6px 10px;
    }
    .bottom-bar button {
      background: rgba(30, 41, 59, 0.9); color: #f1f5f9;
      border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 999px;
      padding: 5px 10px; font-size: 11px; cursor: pointer; white-space: nowrap;
    }
    .bottom-bar button:hover { background: #334155; }
    .bottom-bar button.snap-btn { background: #15803d; border-color: #86efac; font-weight: 700; }

    .toast {
      position: fixed; bottom: 58px; left: 50%; transform: translateX(-50%); z-index: 30;
      background: rgba(15, 23, 42, 0.95); color: #fff; border: 1px solid rgba(250, 204, 21, 0.5);
      padding: 7px 14px; border-radius: 8px; font-size: 12px; display: none; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <!-- 頂部 HUD -->
  <div class="top-hud">
    <div class="hud-title">
      <span class="hud-badge">臺南市政府消防局</span>
      <span id="sceneTitle">3D 火場佈署圖</span>
    </div>
    <div class="hud-meta" id="weatherHud">氣象載入中...</div>
  </div>

  <!-- 手機版面板開關 -->
  <button class="panel-toggle" id="openPanelBtn" onclick="togglePanel(false)">🛠️ 工具</button>

  <!-- 右側戰術工具面板 -->
  <div class="side-panel" id="sidePanel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="sec-label">建物視覺樣式</span>
      <button class="tool-btn" style="padding:2px 6px;" onclick="togglePanel(true)">收合</button>
    </div>
    <div class="btn-row-3">
      <button class="tool-btn active" id="styleHeightBtn" onclick="setBuildingStyle('height')">高度分色</button>
      <button class="tool-btn" id="styleTacticalBtn" onclick="setBuildingStyle('tactical')">戰術降噪</button>
      <button class="tool-btn" id="styleRawBtn" onclick="setBuildingStyle('raw')">原始白模</button>
    </div>

    <span class="sec-label">NLSC 3D Tiles 網址（臺南 LOD1）</span>
    <div class="tiles-input-row">
      <input id="tilesetUrlInput" type="text" placeholder="貼上臺南 3D tileset.json 網址" />
      <button class="tool-btn" onclick="applyCustomTileset()">載入</button>
    </div>

    <span class="sec-label">戰術部署標繪</span>
    <div class="btn-row">
      <button class="tool-btn blue" id="modeEngineBtn" onclick="setToolMode('engine')">🚒 水箱車</button>
      <button class="tool-btn blue" id="modeLadderBtn" onclick="setToolMode('ladder')">🪜 雲梯(25m)</button>
      <button class="tool-btn blue" id="modeCmdBtn" onclick="setToolMode('cmd')">⭐ 指揮站</button>
      <button class="tool-btn blue" id="modeHoseBtn" onclick="setToolMode('hose')">〰️ 拉水線(20m)</button>
    </div>
    <div class="btn-row">
      <button class="tool-btn" onclick="undoLastPlacement()">↩️ 復原一筆</button>
      <button class="tool-btn" onclick="clearCustomPlacements()">🗑️ 清空標繪</button>
    </div>

    <div class="info-box" id="statusReadout">
      • 點擊消防栓柱體可切換：🟢未占用 → 🔵已佔用 → ⛔無法用<br/>
      • 選擇「拉水線」後依序點選起點與終點，自動換算 20m 水帶條數
    </div>
  </div>

  <!-- 底部視角與截圖 -->
  <div class="bottom-bar">
    <button onclick="flyPreset('top')">俯視</button>
    <button onclick="flyPreset('N')">北</button>
    <button onclick="flyPreset('E')">東</button>
    <button onclick="flyPreset('S')">南</button>
    <button onclick="flyPreset('W')">西</button>
    <button class="snap-btn" onclick="takeSnapshot()">📷 截圖</button>
  </div>

  <div class="toast" id="toastBox"></div>

  <script>
    let currentBuildingStyle = "height";
    let buildingTileset = null;
    let toolMode = null;
    let hoseStartPos = null;
    let toastTimer = null;
    const tacticalEntities = [];
    const customEntities = [];

    const params = new URLSearchParams(window.location.search);
    const parsedLat = parseFloat(params.get("lat"));
    const parsedLng = parseFloat(params.get("lng"));
    const INIT_LAT = Number.isFinite(parsedLat) ? parsedLat : 23.0482;
    const INIT_LNG = Number.isFinite(parsedLng) ? parsedLng : 120.1856;
    const SCENE_LABEL = params.get("label") || `起火點 (${INIT_LAT.toFixed(4)}, ${INIT_LNG.toFixed(4)})`;
    const CHAT_ID = params.get("chatId") || "";
    const GAS_API_URL = params.get("gasUrl") || "";
    const rawTileset = (params.get("tileset") || "").trim();
    const INIT_TILESET = /^https?:\/\//i.test(rawTileset) ? rawTileset : "";
    const ION_TOKEN = (params.get("ionToken") || "").trim();
    if (ION_TOKEN && typeof Cesium !== "undefined") {
      Cesium.Ion.defaultAccessToken = ION_TOKEN;
    }

    document.getElementById("sceneTitle").textContent = SCENE_LABEL;
    document.getElementById("tilesetUrlInput").value = INIT_TILESET;

    function showToast(msg) {
      const el = document.getElementById("toastBox");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.style.display = "none"; }, 2800);
    }

    window.onerror = function (message, source, lineno) {
      showToast(`前端錯誤：${message} (L${lineno || "?"})`);
    };

    function togglePanel(collapse) {
      const panel = document.getElementById("sidePanel");
      const btn = document.getElementById("openPanelBtn");
      if (collapse) {
        panel.classList.add("collapsed");
        btn.style.display = "block";
      } else {
        panel.classList.remove("collapsed");
        btn.style.display = "none";
      }
    }

    // 1. 串接 NLSC WMTS PHOTO2 正射航照底圖
    const nlscPhotoProvider = new Cesium.WebMapTileServiceImageryProvider({
      url: "https://wmts.nlsc.gov.tw/wmts/PHOTO2/{Style}/{TileMatrixSet}/{TileMatrix}/{TileRow}/{TileCol}",
      layer: "PHOTO2",
      style: "default",
      format: "image/jpeg",
      tileMatrixSetID: "GoogleMapsCompatible",
      tilingScheme: new Cesium.WebMercatorTilingScheme(),
      maximumLevel: 19,
      credit: new Cesium.Credit("內政部國土測繪中心 NLSC PHOTO2")
    });

    const viewer = new Cesium.Viewer("cesiumContainer", {
      animation: false,
      timeline: false,
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      fullscreenButton: false,
      infoBox: false,
      selectionIndicator: false,
      skyBox: false,
      baseLayer: new Cesium.ImageryLayer(nlscPhotoProvider)
    });

    viewer.scene.backgroundColor = Cesium.Color.fromCssColorString("#0f172a");
    viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString("#1e293b");
    viewer.scene.globe.depthTestAgainstTerrain = false;
    viewer.scene.shadows = false;

    // 2. 3D 建物樣式與載入
    function buildTileStyle(mode) {
      if (mode === "raw") {
        return new Cesium.Cesium3DTileStyle({
          color: "color('#e2e8f0', 0.72)"
        });
      }
      if (mode === "tactical") {
        return new Cesium.Cesium3DTileStyle({
          color: {
            conditions: [
              ["${height} >= 21", "color('#f59e0b', 0.72)"],
              ["${height} >= 10", "color('#64748b', 0.72)"],
              ["true", "color('#334155', 0.65)"]
            ]
          }
        });
      }
      return new Cesium.Cesium3DTileStyle({
        color: {
          conditions: [
            ["${height} >= 21", "color('#f59e0b', 0.72)"],
            ["${height} >= 10", "color('#4b7bec', 0.72)"],
            ["true", "color('#6c8ebf', 0.72)"]
          ]
        }
      });
    }

    function setBuildingStyle(mode) {
      currentBuildingStyle = mode;
      ["height", "tactical", "raw"].forEach(k => {
        const btn = document.getElementById("style" + k.charAt(0).toUpperCase() + k.slice(1) + "Btn");
        if (btn) btn.classList.toggle("active", k === mode);
      });
      if (buildingTileset) {
        buildingTileset.style = buildTileStyle(mode);
      }
      showToast("已切換建物樣式：" + ({ height: "高度分色", tactical: "戰術降噪", raw: "原始白模" }[mode] || mode));
    }

    async function loadBuildingTileset(url) {
      if (buildingTileset) {
        viewer.scene.primitives.remove(buildingTileset);
        buildingTileset = null;
      }
      const cleanUrl = String(url || "").trim();
      if (!cleanUrl) return;
      if (!/^https?:\/\//i.test(cleanUrl)) {
        showToast("請輸入有效的 http/https 3D Tiles 網址");
        return;
      }
      try {
        const ts = await Cesium.Cesium3DTileset.fromUrl(cleanUrl);
        ts.style = buildTileStyle(currentBuildingStyle);
        viewer.scene.primitives.add(ts);
        buildingTileset = ts;
        showToast("已載入 3D 建物圖層");
      } catch (err) {
        console.error(err);
        showToast("3D Tiles 載入失敗（若遇 CORS 需經代理）");
      }
    }

    function applyCustomTileset() {
      const val = document.getElementById("tilesetUrlInput").value.trim();
      loadBuildingTileset(val);
    }

    if (INIT_TILESET) loadBuildingTileset(INIT_TILESET);

    // 3. 起火點、消防栓三態柱體與風向煙羽
    function addFireOrigin(lat, lng) {
      const pos = Cesium.Cartesian3.fromDegrees(lng, lat, 0);
      const ent = viewer.entities.add({
        position: pos,
        cylinder: {
          length: 28,
          topRadius: 2.5,
          bottomRadius: 6.5,
          material: Cesium.Color.RED.withAlpha(0.85),
          outline: true,
          outlineColor: Cesium.Color.YELLOW
        },
        label: {
          text: "🔥 起火點",
          font: "bold 13px sans-serif",
          fillColor: Cesium.Color.WHITE,
          backgroundColor: Cesium.Color.fromCssColorString("#dc2626").withAlpha(0.9),
          showBackground: true,
          pixelOffset: new Cesium.Cartesian2(0, -26),
          disableDepthTestDistance: Number.POSITIVE_INFINITY
        }
      });
      tacticalEntities.push(ent);
    }

    const STATUS_CYCLE = ["FREE", "OCCUPIED", "UNAVAILABLE"];
    const STATUS_META = {
      FREE:        { icon: "🟢", text: "未占用", color: Cesium.Color.fromCssColorString("#16a34a") },
      OCCUPIED:    { icon: "🔵", text: "已佔用", color: Cesium.Color.fromCssColorString("#2563eb") },
      UNAVAILABLE: { icon: "⛔", text: "無法用", color: Cesium.Color.fromCssColorString("#64748b") }
    };

    function addHydrantMarkers(hydrants) {
      hydrants.slice(0, 13).forEach((h, idx) => {
        const num = idx + 1;
        let stCode = h.status || "FREE";
        const pos = Cesium.Cartesian3.fromDegrees(h.lng, h.lat, 0);

        const updateVisual = (entity) => {
          const meta = STATUS_META[stCode] || STATUS_META.FREE;
          entity.cylinder.material = meta.color.withAlpha(0.88);
          entity.label.text = `${meta.icon}#${num} ${h.unit || meta.text}`;
          entity.label.backgroundColor = meta.color.withAlpha(0.92);
        };

        const ent = viewer.entities.add({
          position: pos,
          properties: { isHydrant: true, hydrantIndex: num },
          cylinder: {
            length: 14,
            topRadius: 3.2,
            bottomRadius: 3.2,
            material: STATUS_META.FREE.color.withAlpha(0.88),
            outline: true,
            outlineColor: Cesium.Color.WHITE
          },
          label: {
            text: `🟢#${num} 未占用`,
            font: "bold 11px sans-serif",
            fillColor: Cesium.Color.WHITE,
            backgroundColor: STATUS_META.FREE.color.withAlpha(0.92),
            showBackground: true,
            pixelOffset: new Cesium.Cartesian2(0, -18),
            disableDepthTestDistance: Number.POSITIVE_INFINITY
          }
        });

        ent._cycleStatus = () => {
          const nextIdx = (STATUS_CYCLE.indexOf(stCode) + 1) % STATUS_CYCLE.length;
          stCode = STATUS_CYCLE[nextIdx];
          h.unit = "";
          updateVisual(ent);
          showToast(`#${num} 號栓已切換為：${STATUS_META[stCode].icon} ${STATUS_META[stCode].text}`);
        };

        updateVisual(ent);
        tacticalEntities.push(ent);
      });
    }

    function addWindAndPlume(lat, lng, windDeg, windSpeedMs) {
      const safeDeg = Number.isFinite(Number(windDeg)) ? Number(windDeg) : 225;
      const safeSpeed = Number.isFinite(Number(windSpeedMs)) ? Number(windSpeedMs) : 2.5;
      const downwindDeg = (safeDeg + 180) % 360;
      const rad = Cesium.Math.toRadians(downwindDeg);
      const distDegLat = (45 * Math.cos(rad)) / 111320;
      const distDegLng = (45 * Math.sin(rad)) / (111320 * Math.cos(Cesium.Math.toRadians(lat)));

      const endLat = lat + distDegLat;
      const endLng = lng + distDegLng;

      const arrow = viewer.entities.add({
        polyline: {
          positions: Cesium.Cartesian3.fromDegreesArrayHeights([
            lng, lat, 16,
            endLng, endLat, 22
          ]),
          width: 5,
          material: new Cesium.PolylineArrowMaterialProperty(Cesium.Color.CYAN)
        }
      });

      const midLat = lat + distDegLat * 0.55;
      const midLng = lng + distDegLng * 0.55;
      const plume = viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(midLng, midLat, 18),
        ellipsoid: {
          radii: new Cesium.Cartesian3(26, 14, 10),
          material: Cesium.Color.fromCssColorString("#cbd5e1").withAlpha(0.32)
        }
      });

      tacticalEntities.push(arrow, plume);
      document.getElementById("weatherHud").textContent =
        `🌬️ 風向 ${Math.round(safeDeg)}° → 下風 ${Math.round(downwindDeg)}°（${safeSpeed.toFixed(1)} m/s）`;
    }

    // 4. 戰術標繪工具
    function setToolMode(mode) {
      toolMode = (toolMode === mode) ? null : mode;
      hoseStartPos = null;
      ["engine", "ladder", "cmd", "hose"].forEach(m => {
        const btn = document.getElementById("mode" + m.charAt(0).toUpperCase() + m.slice(1) + "Btn");
        if (btn) btn.classList.toggle("active", toolMode === m);
      });
      const labels = {
        engine: "點擊地圖放置「水箱車」",
        ladder: "點擊地圖放置「雲梯車（含 25m 升梯半徑）」",
        cmd: "點擊地圖放置「指揮站」",
        hose: "請依序點擊「水線起點」與「水線終點」"
      };
      showToast(toolMode ? labels[toolMode] : "已取消標繪模式");
    }

    function placeVehicleOrCmd(cartographic, type) {
      const lon = Cesium.Math.toDegrees(cartographic.longitude);
      const lat = Cesium.Math.toDegrees(cartographic.latitude);
      const pos = Cesium.Cartesian3.fromDegrees(lon, lat, 1);

      const cfg = {
        engine: { text: "🚒 水箱車", bg: "#1d4ed8", radius: 0 },
        ladder: { text: "🪜 雲梯車", bg: "#d97706", radius: 25 },
        cmd:    { text: "⭐ 指揮站", bg: "#991b1b", radius: 0 }
      }[type];

      const marker = viewer.entities.add({
        position: pos,
        point: {
          pixelSize: 12,
          color: Cesium.Color.fromCssColorString(cfg.bg),
          outlineColor: Cesium.Color.WHITE,
          outlineWidth: 2,
          disableDepthTestDistance: Number.POSITIVE_INFINITY
        },
        label: {
          text: cfg.text,
          font: "bold 12px sans-serif",
          fillColor: Cesium.Color.WHITE,
          backgroundColor: Cesium.Color.fromCssColorString(cfg.bg).withAlpha(0.9),
          showBackground: true,
          pixelOffset: new Cesium.Cartesian2(0, -18),
          disableDepthTestDistance: Number.POSITIVE_INFINITY
        }
      });
      customEntities.push(marker);

      if (cfg.radius > 0) {
        const circle = viewer.entities.add({
          position: Cesium.Cartesian3.fromDegrees(lon, lat, 0.5),
          ellipse: {
            semiMajorAxis: cfg.radius,
            semiMinorAxis: cfg.radius,
            material: Cesium.Color.ORANGE.withAlpha(0.18),
            outline: true,
            outlineColor: Cesium.Color.ORANGE,
            outlineWidth: 2
          }
        });
        customEntities.push(circle);
      }
    }

    function addHoseLine(p1, p2) {
      const distM = Cesium.Cartesian3.distance(p1, p2);
      const count20m = Math.max(1, Math.ceil(distM / 20));
      const mid = Cesium.Cartesian3.midpoint(p1, p2, new Cesium.Cartesian3());

      const lineEnt = viewer.entities.add({
        polyline: {
          positions: [p1, p2],
          width: 4,
          material: Cesium.Color.fromCssColorString("#38bdf8"),
          clampToGround: true
        },
        label: {
          text: `〰️ ${Math.round(distM)}m（約 ${count20m} 條水帶）`,
          font: "bold 11px sans-serif",
          fillColor: Cesium.Color.WHITE,
          backgroundColor: Cesium.Color.fromCssColorString("#0369a1").withAlpha(0.92),
          showBackground: true,
          disableDepthTestDistance: Number.POSITIVE_INFINITY
        },
        position: mid
      });
      customEntities.push(lineEnt);
      document.getElementById("statusReadout").innerHTML =
        `最新水線：<b>${Math.round(distM)} 公尺</b>（每條 20m 約需 <b>${count20m} 條</b>）`;
    }

    function undoLastPlacement() {
      const last = customEntities.pop();
      if (last) {
        viewer.entities.remove(last);
        showToast("已復原上一筆標繪");
      }
    }

    function clearCustomPlacements() {
      while (customEntities.length > 0) {
        viewer.entities.remove(customEntities.pop());
      }
      hoseStartPos = null;
      showToast("已清空自訂標繪");
    }

    const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
    handler.setInputAction((click) => {
      const picked = viewer.scene.pick(click.position);
      if (picked && picked.id && typeof picked.id._cycleStatus === "function") {
        picked.id._cycleStatus();
        return;
      }
      if (!toolMode) return;

      const ray = viewer.camera.getPickRay(click.position);
      const cartesian = viewer.scene.globe.pick(ray, viewer.scene);
      if (!cartesian) return;

      if (toolMode === "hose") {
        if (!hoseStartPos) {
          hoseStartPos = cartesian;
          showToast("已選取水線起點，請再點選終點");
        } else {
          addHoseLine(hoseStartPos, cartesian);
          hoseStartPos = null;
        }
        return;
      }

      const carto = Cesium.Cartographic.fromCartesian(cartesian);
      placeVehicleOrCmd(carto, toolMode);
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    // 5. 快捷視角與截圖
    function flyPreset(dir) {
      const target = Cesium.Cartesian3.fromDegrees(INIT_LNG, INIT_LAT, 0);
      const presets = {
        top: { heading: 0, pitch: -89, range: 240 },
        N:   { heading: Cesium.Math.toRadians(180), pitch: -35, range: 230 },
        E:   { heading: Cesium.Math.toRadians(270), pitch: -35, range: 230 },
        S:   { heading: Cesium.Math.toRadians(0),   pitch: -35, range: 230 },
        W:   { heading: Cesium.Math.toRadians(90),  pitch: -35, range: 230 }
      };
      const cfg = presets[dir] || presets.top;
      viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(target, 1), {
        offset: new Cesium.HeadingPitchRange(cfg.heading, Cesium.Math.toRadians(cfg.pitch), cfg.range),
        duration: 0.7
      });
    }

    function takeSnapshot() {
      try {
        viewer.render();
        const dataUrl = viewer.scene.canvas.toDataURL("image/png");
        const link = document.createElement("a");
        link.download = `tnfd_3d_${Date.now()}.png`;
        link.href = dataUrl;
        link.click();
        showToast("已下載 3D 佈署圖截圖");
      } catch (snapErr) {
        showToast("截圖受跨網域畫布限制，請改用系統截圖");
      }
    }

    // 6. 載入氣象與場次資料
    async function fetchWithTimeout(url, timeoutMs = 4500) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { signal: controller.signal });
      } finally {
        clearTimeout(timer);
      }
    }

    async function initSceneData() {
      addFireOrigin(INIT_LAT, INIT_LNG);
      flyPreset("top");

      let windDeg = 225;
      let windSpeed = 2.5;
      let hydrants = [];
      let weatherLoaded = false;

      try {
        const wRes = await fetchWithTimeout(
          `https://api.open-meteo.com/v1/forecast?latitude=${INIT_LAT}&longitude=${INIT_LNG}&current=wind_speed_10m,wind_direction_10m&wind_speed_unit=ms`
        );
        if (wRes.ok) {
          const wJson = await wRes.json();
          if (wJson.current && typeof wJson.current.wind_direction_10m === "number") {
            windDeg = wJson.current.wind_direction_10m;
            windSpeed = wJson.current.wind_speed_10m;
            weatherLoaded = true;
          }
        }
      } catch (e) {
        console.warn("氣象查詢逾時或失敗，使用預設風向：", e);
      }

      if (GAS_API_URL && CHAT_ID) {
        try {
          const sRes = await fetchWithTimeout(`${GAS_API_URL}?action=scene&chatId=${encodeURIComponent(CHAT_ID)}`);
          if (sRes.ok) {
            const sJson = await sRes.json();
            if (Array.isArray(sJson.hydrants)) hydrants = sJson.hydrants;
            if (sJson.wind && typeof sJson.wind.deg === "number") {
              windDeg = sJson.wind.deg;
              windSpeed = sJson.wind.speed || windSpeed;
              weatherLoaded = true;
            }
          }
        } catch (e) {
          console.warn("GAS 場次載入失敗，改用示範點位：", e);
        }
      }

      if (hydrants.length === 0) {
        for (let i = 0; i < 13; i++) {
          const ang = (i * (360 / 13)) * Math.PI / 180;
          const r = 0.00055 + (i % 3) * 0.00022;
          hydrants.push({
            lat: INIT_LAT + Math.cos(ang) * r,
            lng: INIT_LNG + Math.sin(ang) * r,
            status: i === 1 ? "OCCUPIED" : (i === 4 ? "UNAVAILABLE" : "FREE"),
            unit: i === 1 ? "安平11車" : ""
          });
        }
      }

      addHydrantMarkers(hydrants);
      addWindAndPlume(INIT_LAT, INIT_LNG, windDeg, windSpeed);
      if (!weatherLoaded) {
        document.getElementById("weatherHud").textContent += "（預設參考）";
      }
    }

    initSceneData();
  </script>
</body>
